name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install black flake8
          pip install -r requirements.txt
      - name: Black
        run: black --check src
      - name: Flake8
        run: flake8 src --max-line-length=88 --extend-ignore=E203
      - name: Harness
        run: python src/test_harness.py
