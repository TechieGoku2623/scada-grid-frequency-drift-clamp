name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Black
        run: black --check src tests
      - name: Flake8
        run: flake8 src tests --max-line-length=88 --extend-ignore=E203
      - name: Harness
        run: python -m scada_grid_frequency_drift_clamp.harness
      - name: Tests
        run: python -m unittest discover -s tests -v
